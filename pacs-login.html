<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACS Login - AnajTrack</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#e8f5e9,#f1f8e9);display:flex;align-items:center;justify-content:center;padding:20px}
.login-container{width:100%;max-width:520px;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15);overflow:hidden}
.header{background:#176b2c;color:#fff;text-align:center;padding:25px 20px}
.header h1{font-size:28px;margin-bottom:8px}.header p{font-size:15px;opacity:.92}
.form-section{padding:30px}.form-group{margin-bottom:17px}
label{display:block;font-weight:bold;color:#333;margin-bottom:7px}
input,select{width:100%;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:15px;outline:none;background:#fff}
input:focus,select:focus{border-color:#176b2c;box-shadow:0 0 5px rgba(23,107,44,.2)}
.login-btn{width:100%;padding:14px;border:0;border-radius:9px;background:#176b2c;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:7px}
.login-btn:hover{background:#0e5120}.home-btn{display:block;text-align:center;text-decoration:none;color:#176b2c;font-weight:bold;margin-top:18px}
.status{display:none;margin-top:12px;padding:10px;border-radius:7px;background:#fff8e1;color:#795548;font-size:13px}
.footer{text-align:center;background:#f5f5f5;padding:15px;color:#666;font-size:13px}
@media(max-width:600px){.form-section{padding:22px}.header h1{font-size:24px}}
</style>
</head>
<body>
<div class="login-container">
  <div class="header">
    <h1>🏪 PACS Login</h1>
    <p>AnajTrack Procurement Management System</p>
  </div>

  <div class="form-section">
    <div class="form-group">
      <label for="pacsId">PACS ID</label>
      <input type="text" id="pacsId" placeholder="Enter PACS ID">
    </div>

    <div class="form-group">
      <label for="mobile">Registered Mobile Number</label>
      <input type="tel" id="mobile" maxlength="10" placeholder="Enter 10 digit mobile number">
    </div>

    <div class="form-group">
      <label for="state">State / UT</label>
      <select id="state"><option value="">Loading States...</option></select>
    </div>

    <div class="form-group">
      <label for="district">District</label>
      <select id="district" disabled><option value="">Select District</option></select>
    </div>

    <div class="form-group">
      <label for="block">Block / Sub-District</label>
      <select id="block" disabled><option value="">Select Block</option></select>
    </div>

    <div class="form-group">
      <label for="panchayat">Gram Panchayat / Local Body</label>
      <select id="panchayat" disabled><option value="">Select Gram Panchayat</option></select>
    </div>

    <div id="status" class="status"></div>

    <button type="button" class="login-btn" onclick="openPacsDashboard()">Login</button>
    <a href="index.html" class="home-btn">← Back to Home</a>
  </div>

  <div class="footer">© 2026 AnajTrack | Smart Procurement Management System</div>
</div>

<script>
const API="https://lgdirectory.gov.in/webservices/lgdws";
const stateSelect=document.getElementById("state");
const districtSelect=document.getElementById("district");
const blockSelect=document.getElementById("block");
const panchayatSelect=document.getElementById("panchayat");
const statusBox=document.getElementById("status");

function setOptions(select,items,placeholder,valueKey,textKey){
  select.innerHTML="";
  const first=document.createElement("option");
  first.value=""; first.textContent=placeholder; select.appendChild(first);
  items.forEach(item=>{
    const option=document.createElement("option");
    option.value=item[valueKey] ?? "";
    option.textContent=item[textKey] ?? "";
    select.appendChild(option);
  });
}
function showStatus(message){statusBox.textContent=message;statusBox.style.display="block"}
function hideStatus(){statusBox.style.display="none"}

async function getJSON(url){
  const response=await fetch(url,{method:"GET",headers:{"Accept":"application/json"}});
  if(!response.ok) throw new Error("Request failed: "+response.status);
  return await response.json();
}

async function loadStates(){
  try{
    hideStatus();
    const data=await getJSON(API+"/stateList");
    const states=Array.isArray(data)?data:(data.data||data.states||[]);
    setOptions(stateSelect,states,"Select State / UT","stateCode","stateNameEnglish");
  }catch(error){
    stateSelect.innerHTML='<option value="">Unable to load states</option>';
    showStatus("LGD location data could not be loaded. Use Live Server/local web server and check internet connection.");
  }
}

stateSelect.addEventListener("change",async function(){
  const stateCode=this.value;
  districtSelect.disabled=true; blockSelect.disabled=true; panchayatSelect.disabled=true;
  districtSelect.innerHTML='<option value="">Loading Districts...</option>';
  blockSelect.innerHTML='<option value="">Select Block</option>';
  panchayatSelect.innerHTML='<option value="">Select Gram Panchayat</option>';
  if(!stateCode)return;
  try{
    const data=await getJSON(API+"/districtList?stateCode="+encodeURIComponent(stateCode));
    const districts=Array.isArray(data)?data:(data.data||data.districts||[]);
    setOptions(districtSelect,districts,"Select District","districtCode","districtNameEnglish");
    districtSelect.disabled=false; hideStatus();
  }catch(error){
    districtSelect.innerHTML='<option value="">Unable to load districts</option>';
    showStatus("District data could not be loaded.");
  }
});

districtSelect.addEventListener("change",async function(){
  const districtCode=this.value;
  blockSelect.disabled=true; panchayatSelect.disabled=true;
  blockSelect.innerHTML='<option value="">Loading Blocks...</option>';
  panchayatSelect.innerHTML='<option value="">Select Gram Panchayat</option>';
  if(!districtCode)return;
  try{
    const data=await getJSON(API+"/blockList?districtCode="+encodeURIComponent(districtCode));
    const blocks=Array.isArray(data)?data:(data.data||data.blocks||[]);
    setOptions(blockSelect,blocks,"Select Block","blockCode","blockNameEnglish");
    blockSelect.disabled=false; hideStatus();
  }catch(error){
    blockSelect.innerHTML='<option value="">Unable to load blocks</option>';
    showStatus("Block data could not be loaded.");
  }
});

blockSelect.addEventListener("change",async function(){
  const blockCode=this.value;
  panchayatSelect.disabled=true;
  panchayatSelect.innerHTML='<option value="">Loading Gram Panchayats...</option>';
  if(!blockCode)return;
  try{
    const data=await getJSON(API+"/getBlockwiseMappedGP?blockCode="+encodeURIComponent(blockCode));
    const gps=Array.isArray(data)?data:(data.data||data.localBodies||data.gps||[]);
    setOptions(panchayatSelect,gps,"Select Gram Panchayat","localBodyCode","localBodyNameEnglish");
    panchayatSelect.disabled=false; hideStatus();
  }catch(error){
    panchayatSelect.innerHTML='<option value="">Unable to load Panchayats</option>';
    showStatus("Gram Panchayat data could not be loaded.");
  }
});

// Direct login: no verification
function openPacsDashboard(){
  window.location.href="pacsdashboard.html";
}

loadStates();
</script>
</body>
</html>
